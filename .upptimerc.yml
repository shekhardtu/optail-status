owner: shekhardtu
repo: optail-status

sites:
  - name: Optail API
    url: https://api.optail.io/health
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: Optail Dashboard
    url: https://app.optail.io/
    method: HEAD
    expectedStatusCodes:
      - 200
  - name: Optail Landing + Docs
    url: https://optail.io/
    method: HEAD
    expectedStatusCodes:
      - 200
  - name: Optail Webhook Ingester
    url: https://webhooks.optail.io/health
    expectedStatusCodes:
      - 200

status-website:
  # Until status.optail.io CNAME is configured, the page lives at
  # https://shekhardtu.github.io/optail-status. Swap `baseUrl` for `cname`
  # when DNS is ready: see docs/operations/uptime.md → "Custom domain".
  baseUrl: /optail-status
  # cname: status.optail.io
  logoUrl: https://raw.githubusercontent.com/shekhardtu/optail/main/packages/shared/src/brand/optail-mark.svg
  name: Optail Status
  introTitle: "**Optail** is the open-source provider-failover-first transactional email platform."
  introMessage: Live status + 90-day uptime history for `api.optail.io`, `app.optail.io`, `optail.io`, and `webhooks.optail.io`. Failed probes open a GitHub Issue automatically; recovery auto-closes it. [Source repo](https://github.com/shekhardtu/optail).
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/shekhardtu/optail
    - title: Site
      href: https://optail.io
    - title: Docs
      href: https://optail.io/docs

# Notifications: failed probes auto-open GitHub Issues in this repo. To
# pipe alerts to Slack/Discord/email, add the relevant webhook secrets
# and uncomment the `notifications:` block below. See:
#   https://upptime.js.org/docs/notifications
#
# notifications:
#   - type: slack
#     channel: incidents
#     token: $SLACK_TOKEN
